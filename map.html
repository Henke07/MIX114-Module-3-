<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map filter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="map-page">

    <!--Header til alle sidene-->
    <header class="site-header" role="banner">
        <div class="header-content">
            <a href="index.html" class="logo" aria-label="Hjem og Jobb — gå til forsiden">
                <span class="logo-icon" aria-hidden="true">🏠</span>
                <span class="logo-text">Hjem<span class="logo-amp">&amp;</span>Jobb</span>
            </a>

            <nav class="main-nav" aria-label="Hovednavigasjon">
                <a href="index.html" class="nav-link">Hjem</a>
                <a href="map.html" class="nav-link nav-link--active">Søk</a>
                <a href="comparison.html" class="nav-link">Sammenlign</a>
            </nav>
        </div>
    </header>

    <main id="main-content">

        <div class="map-layout">

        <aside class="container-filter" aria-label="Filter">

            <h1 class="filter-title">Filter</h1>

            <!-- Arbeidssted -->
            <div class="container-arbeidssted">
                <input
                    type="text"
                    id="work-location"
                    class="input input--container--color"
                    placeholder="Legg inn arbeidssted"
                    aria-label="Legg inn arbeidssted"
                />
            </div>

            <!-- Fremkomstmiddel -->
            <div>
    <p class="filter-label">Velg ditt fremkomstmiddel</p>

    <div class="container-options">

        <label class="fremkomst-option">
            <input
                type="radio"
                name="transport"
                value="buss"
            />
            <span>Buss</span>
        </label>

        <label class="fremkomst-option">
            <input
                type="radio"
                name="transport"
                value="bil"
            />
            <span>Bil</span>
        </label>

        <label class="fremkomst-option">
            <input
                type="radio"
                name="transport"
                value="gå"
            />
            <span>Gå</span>
        </label>

    </div>
</div>

            <!-- Reisevei -->
            <div class="container-reisevei">
                <div>
                    <p class="filter-label">Reisevei</p>
                    <select id="input-reisetid" class="input input--container--color" aria-label="Maks reisetid">
                        <option value="" disabled selected>Maks tid fra hjem til jobb</option>
                        <option value="15">15 minutter</option>
                        <option value="30">30 minutter</option>
                        <option value="45">45 minutter</option>
                        <option value="60">60 minutter</option>
                    </select>
                </div>
            </div>

            <!-- Budsjett -->
            <div class="container-budsjett">
                <p class="filter-label">Budsjett</p>
                <div class="budjsett-rekke">
                    <input
                        id="min-price"
                        type="number"
                        class="input input--container--color"
                        placeholder="Min pris"
                        aria-label="Minimumspris"
                    />
                    <span class="budget-separator" aria-hidden="true">–</span>
                    <input
                        id="max-price"
                        type="number"
                        class="input input--container--color"
                        placeholder="Max pris"
                        aria-label="Maksimumspris"
                    />
                </div>
            </div>

            <!-- Fasiliteter -->
            <div>
                <p class="filter-label">Hva er viktig for deg å ha i nærheten?</p>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="fasiliteter" value="barnehage"> Barnehage
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="fasiliteter" value="skole"> Skole
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="fasiliteter" value="apotek"> Apotek
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="fasiliteter" value="kollektiv"> Kollektiv transport
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="fasiliteter" value="matbutikk"> Matbutikk
                    </label>
                </div>
            </div>

            <!-- Buttons -->
            <div class="button-row">
                <button type="submit" class="btn btn--primary">Søk</button>
                <button type="reset" class="btn btn--secondary">Nullstill filter</button>
            </div>

        </aside>

        <section class="map-section" aria-label="Kart">
            <div id="map"></div>

            <section class="best-matches"></section>

        </section>

        </div>

    </main>

    <!--Felles footer-->
    <footer class="site-footer" role="contentinfo">
        <div class="footer-content">
            <ul class="footer-links" role="list">
                <li class="footer-link-item"><a href="#about" class="footer-link">Om oss</a></li>
                <li class="footer-link-item"><a href="#contact" class="footer-link">Kontakt oss</a></li>
                <li class="footer-link-item"><a href="#privacy" class="footer-link">Personvern</a></li>
            </ul>
            <a href="index.html" class="footer-logo">
                <span class="footer-logo-mark" aria-hidden="true">✓</span>
                <span class="footer-logo-text">Reisevei</span>
            </a>
        </div>
    </footer>
    <script src="config.js"></script>
    <script src="script.js"></script>
    <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBFkMoWM4aP5EWSQ1Q2AjPfZwws7PoQ4G0&callback=initMap">
    </script>
</body>
</html>
