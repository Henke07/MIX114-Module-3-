<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sammenlign områder</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/highcharts-more.js"></script>
</head>

<body class="compariosn-page">

    <!--Header til alle sidene-->
    <header class="site-header" role="banner">
        <div class="header-content">
            <a href="index.html" class="logo" aria-label="Reisevei — gå til forsiden">
                <span class="logo-icon" aria-hidden="true">🏘️</span>
                <span class="logo-text">Reisevei</span>
            </a>

            <nav class="main-nav" aria-label="Hovednavigasjon">
                <button type="button" class="header-search-button" id="header-search-button">
                    <span class="header-search-text">Søk</span>
                </button>
                <button type="button" class="header-profile-button" id="header-profile-button" aria-label="Min profil">
                    <span class="header-profile-icon" aria-hidden="true">👤</span>
                </button>
            </nav>
        </div>
    </header>


    <main id="main-content">

    <!-- Back link -->
    <nav class="back-nav">
        <a href="map.html" class="back-link" id="back-link">
            <span class="back-arrow" aria-hidden="true">←</span>
            <span class="back-text">Tilbake</span>
        </a>
    </nav>

    <!-- Title -->
    <header class="compare-header">
        <h1 class="compare-title">Sammenlign områder</h1>
    </header>

    <!-- Sammenligning select -->
    <div class="compare-controls">

    <select id="area-one">
        <option value="">Velg område</option>
    </select>

    <select id="area-two">
        <option value="">Velg område</option>
    </select>

    <button id="compare-btn">
        Sammenlign
    </button>

</div>

    <!-- Grid dynamisk fra API -->
    <section class="compare-grid" id="compare-grid">

        <!-- TEMPLATE -->
        <article class="compare-column" id="area-template" style="display:none;">

            <header class="column-header">
                <figure class="column-image-wrapper">
                    <img src="" alt="" class="column-image" data-image>
                    <figcaption class="column-image-title" data-name></figcaption>
                </figure>
                <span class="match-badge" data-match></span>
            </header>

            <!-- Chart -->
            <section class="chart-section">
                <h2 class="chart-title">Kostnad vs. Reisetid</h2>
                <div class="chart" data-chart></div>

                <ul class="chart-values">
                    <li>
                        <span>Kostnad</span>
                        <span data-cost></span>
                    </li>
                    <li>
                        <span>Reisetid</span>
                        <span data-time></span>
                    </li>
                </ul>
            </section>

            <!-- AI -->
            <section class="ai-explanation">
                <h2>✦ AI forklaring</h2>
                <p data-ai></p>
            </section>

            <!-- Commute -->
            <section class="commute-timeline">
                <h2>Pendlerkart</h2>

                <div class="commute-total-time">
                    ⏱ <span data-total-time></span>
                </div>

                <ol class="route-timeline" data-route></ol>
            </section>

            <!-- Pros/Cons -->
            <section class="pros-cons">
                <div class="pros">
                    <h3>Fordeler</h3>
                    <ul data-pros></ul>
                </div>
                <div class="cons">
                    <h3>Ulemper</h3>
                    <ul data-cons></ul>
                </div>
            </section>
        </article>

    </section>

    <!--Ai forklaring-->
    <section class="ai-recommendation">
        <h2>
            ✦ AI Anbefaler:
            <span id="recommended-area"></span>
        </h2>
        <p id="recommendation-text"></p>
    </section>

    <!-- CTA -->
    <div class="home-cta-wrapper">
        <a href="index.html" class="secondary-button">
            Tilbake til forsiden
        </a>
    </div>

    </main>

    <section class="main-comparison-chart">
        <div id="comparison-chart"></div>
    </section>

    <!--Felles footer-->
    <footer class="site-footer" role="contentinfo">
        <div class="footer-content">
            <ul class="footer-links" role="list">
                <li class="footer-link-item"><a href="#about" class="footer-link">Om oss</a></li>
                <li class="footer-link-item"><a href="#contact" class="footer-link">Kontakt oss</a></li>
                <li class="footer-link-item"><a href="#privacy" class="footer-link">Personvern</a></li>
            </ul>
            <a href="index.html" class="footer-logo">
                <span class="footer-logo-mark" aria-hidden="true">🏘️</span>
                <span class="footer-logo-text">Reisevei</span>
            </a>
        </div>
    </footer>
    
    <script src="script-comparison.js"></script>
</body>
</html>
